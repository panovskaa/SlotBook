# NFR-8: linting, type checks, every test level and both builds on every push and pull request.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The type-aware ESLint rules need the generated Prisma types.
      - name: Generate the Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      # ESLint with typescript-eslint strict rules, react-hooks and jsx-a11y (a missing alt fails here).
      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  test:
    name: Type-check, unit and integration tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Type-check
        run: |
          npx tsc -p apps/api/tsconfig.test.json
          npx tsc -p apps/web/tsconfig.json
          npx tsc -p e2e/tsconfig.json

      # Unit tests, plus integration tests against a throwaway Postgres 16 that Testcontainers
      # starts in Docker (available on GitHub's Ubuntu runners).
      - name: API tests
        run: npm test -w @slotbook/api

      - name: Web tests
        run: npm test -w @slotbook/web

      - name: Build
        run: |
          npm exec -w @slotbook/api -- nest build
          npm exec -w @slotbook/web -- vite build

  e2e:
    name: End-to-end and accessibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: slotbook
          POSTGRES_PASSWORD: slotbook
          POSTGRES_DB: slotbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slotbook"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://slotbook:slotbook@localhost:5432/slotbook_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Builds the apps, then Playwright starts the API (which creates and migrates slotbook_e2e)
      # and the web app, and runs every flow on desktop, Pixel 7 and iPhone SE sizes with axe checks.
      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
