# Render Blueprint: the API and the web app on Render's free plan. The database is on Neon and
# email goes through Brevo; see "Hosting it for free" in docs/DETAILS.md.
# Values marked `sync: false` are asked for once, when the Blueprint is first created.
services:
  - type: web
    name: slotbook-api
    runtime: node
    plan: free
    region: frankfurt
    # npm ci also builds packages/shared (postinstall). The API build runs prisma generate.
    buildCommand: npm ci && npm run build -w @slotbook/api
    # Applies any new migrations to Neon before starting, so the tables and rules always match the code.
    startCommand: npx prisma migrate deploy && npm run start -w @slotbook/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: APP_TIMEZONE
        value: Europe/Berlin
      # Requests reach the app through Render's proxies. Check the count after the first deploy:
      # https://<api>/health/ip must show your own IP (compare with https://ifconfig.me).
      - key: TRUST_PROXY
        value: '3'
      - key: HOST_ACCESS_KEY
        generateValue: true
      # Neon's direct (not pooled) connection string, ending in ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # https://slotbook-web.onrender.com, or whatever URL Render gives the web app
      - key: WEB_ORIGIN
        sync: false
      # smtp://<Brevo SMTP login, @ as %40>:<Brevo SMTP key>@smtp-relay.brevo.com:2525
      # Port 2525, not 587: Render free services block outbound ports 25, 465 and 587.
      - key: SMTP_URL
        sync: false
      # The sender you verified in Brevo, e.g. SlotBook <you@example.com>
      - key: MAIL_FROM
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: slotbook-web
    runtime: static
    buildCommand: npm ci && npm run build -w @slotbook/web
    staticPublishPath: apps/web/dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      # The API's public URL, e.g. https://slotbook-api.onrender.com (no trailing slash)
      - key: VITE_API_URL
        sync: false
    # A single-page app: every path (/book/..., /manage/...) serves index.html and React routes it.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
